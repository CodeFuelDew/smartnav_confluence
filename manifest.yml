app:
  id: ari:cloud:ecosystem::app/131947e5-64bd-47b6-8c6b-3c64e2e8aeff
  runtime:
    name: nodejs22.x

modules:
  macro:
    - key: smartnav-tree
      title: Smart Nav Tree
      description: Permission-aware, instant page tree with zero reloads
      resource: main
      resolver:
        function: resolver
      categories:
        - navigation
  function:
    - key: resolver
      handler: resolvers/index.handler

resources:
  - key: main
    path: src/ui

permissions:
  scopes:
    - read:confluence-content.summary
    - read:confluence-space.summary
    - read:confluence-user
    - storage:app
